# Developer path: builds the image from this repository.
# It opens the same paper-portfolio volume as deploy/compose.yaml, so it uses your real book.
name: paper-portfolio

services:
  paper-portfolio:
    build: .
    image: paper-portfolio:dev
    container_name: paper-portfolio
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_PATH: /data/book.sqlite
    volumes:
      - paper-portfolio:/data

volumes:
  paper-portfolio:
    name: paper-portfolio
